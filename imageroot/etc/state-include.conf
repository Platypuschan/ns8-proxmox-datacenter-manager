#
# Proxmox Datacenter Manager state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Only lines starting with "state/" or "volumes/" are considered by NS8.
#

# Administrator password hash (no clear text password)
state/admin.env
# Remotes, API tokens, authentication keys, certificates
volumes/pdm-config
# Metrics database and task state
volumes/pdm-data
# Task logs and access/auth logs
volumes/pdm-log
