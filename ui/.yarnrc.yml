approvedGitRepositories:
  - "**"

enableScripts: true

# VueUse 4 predates Vue 3 peer metadata; both packages forward Vue to vue-demi.
# Keep the correction scoped to the legacy versions consumed by Carbon Vue 3.
packageExtensions:
  "@carbon/vue@3.0.32":
    peerDependencies:
      vue: "^3.0.0"
  "@vueuse/core@4.11.2":
    peerDependencies:
      vue: "^2.6.0 || ^3.0.0"
  "@vueuse/shared@4.11.2":
    peerDependencies:
      vue: "^2.6.0 || ^3.0.0"

nodeLinker: node-modules

npmMinimalAgeGate: 0
